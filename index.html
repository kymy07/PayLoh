<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FCFCF7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#17150F" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Payloh — the calm way to track who owes you what. Log a debt, record part-payments, and send a friendly nudge."
    />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Payloh</title>
    <script>
      // Apply the saved theme before first paint so there is no flash.
      try {
        const stored = localStorage.getItem("payloh-theme")
        const dark =
          stored === "dark" ||
          (stored !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches)
        if (dark) document.documentElement.classList.add("dark")
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
