name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        env:
          # The site lives at kymy07.github.io/PayLoh/, so assets need that prefix.
          VITE_BASE_PATH: /PayLoh/
          # These four are public identifiers, not secrets — they appear in any
          # Firebase web bundle. Access is guarded by database.rules.json.
          VITE_FIREBASE_AUTH_DOMAIN: payloh-website.firebaseapp.com
          VITE_FIREBASE_DATABASE_URL: https://payloh-website-default-rtdb.asia-southeast1.firebasedatabase.app
          VITE_FIREBASE_PROJECT_ID: payloh-website
          VITE_FIREBASE_STORAGE_BUCKET: payloh-website.firebasestorage.app
          # These three come from repo secrets — see SETUP.md.
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: npm run build

      - name: Add SPA fallback
        # Pages has no rewrite rules, so a deep link like /PayLoh/app/debts would
        # 404. Serving index.html as the 404 page lets the router take over.
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
